  <text x="88" y="58" font-size="13" fill="#8a7a66" font-family="Georgia, serif">A. Sharma  ·  Roll 17  ·  Class 10 Biology</text>
  <text x="752" y="58" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">Page 3 of 4</text>

  
      <text x="92" y="118" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">as much light as possible. Spongy mesophyll has</text>
<text x="92" y="146" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">air spaces that let CO2 and O2 diffuse quickly.</text>
      <text x="92" y="318" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Q9. Transpiration is the loss of water vapour from</text>
<text x="92" y="346" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">leaves through stomata. Wind and high temperature</text>
<text x="92" y="374" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">increase the rate.</text>
      <text x="92" y="528" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Xylem vessels are hollow tubes of dead lignified</text>
<text x="92" y="556" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">cells, so a continuous water column can be pulled</text>
<text x="92" y="584" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">up by transpiration.</text>
      <text x="92" y="738" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Q11 (a) Plant B is etiolated — pale, elongated leaves</text>
<text x="92" y="766" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">because it was kept in dim light and stretched</text>
<text x="92" y="794" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">towards any available light.</text>
      <text x="92" y="958" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Q11 (b) Move it into bright light and water regularly.</text>
    
