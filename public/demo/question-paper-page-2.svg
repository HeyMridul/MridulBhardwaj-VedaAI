        <text x="64" y="170" font-size="18" font-weight="700" fill="#2c2c2c" font-family="Georgia, serif">7.</text>
        <text x="118" y="198" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">Draw and label a nephron (Bowman's capsule, glomerulus, proximal tubule, loop of Henle,</text>
<text x="118" y="220" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">distal tubule, collecting duct).</text>
        <text x="736" y="170" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">[4]</text>
      

        <text x="64" y="310" font-size="18" font-weight="700" fill="#2c2c2c" font-family="Georgia, serif">8.</text>
        <text x="118" y="338" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">Explain the structural differences between palisade mesophyll and spongy mesophyll and</text>
<text x="118" y="360" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">state how each structure aids its function in the leaf.</text>
        <text x="736" y="310" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">[3]</text>
      

        <text x="64" y="450" font-size="18" font-weight="700" fill="#2c2c2c" font-family="Georgia, serif">9.</text>
        <text x="118" y="478" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">Describe the process of transpiration in plants in two to three sentences and name two</text>
<text x="118" y="500" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">environmental factors that increase its rate.</text>
        <text x="736" y="450" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">[2]</text>
      

        <text x="64" y="590" font-size="18" font-weight="700" fill="#2c2c2c" font-family="Georgia, serif">10.</text>
        <text x="118" y="618" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">Explain how the structure of xylem vessels facilitates water transport in plants</text>
<text x="118" y="640" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">(mention one adaptation and explain its role).</text>
        <text x="736" y="590" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">[2]</text>
      

        <text x="64" y="730" font-size="18" font-weight="700" fill="#2c2c2c" font-family="Georgia, serif">11(a).</text>
        <text x="118" y="758" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">A diagram shows two potted plants — Plant A in bright light with high water needs, Plant</text>
<text x="118" y="780" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">B kept in dim light with pale, elongated leaves.</text>
        <text x="736" y="730" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">[2]</text>
      

        <text x="64" y="870" font-size="18" font-weight="700" fill="#2c2c2c" font-family="Georgia, serif">11(b).</text>
        <text x="118" y="898" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">Suggest one practical measure to help Plant B recover.</text>
        <text x="736" y="870" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">[1]</text>
      

        <text x="64" y="1010" font-size="18" font-weight="700" fill="#2c2c2c" font-family="Georgia, serif">12.</text>
        <text x="118" y="1038" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">A resting person has tidal volume (air per breath) of 0.5L and breathes 12 times per</text>
