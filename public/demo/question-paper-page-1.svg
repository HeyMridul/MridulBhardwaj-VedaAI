  <text x="400" y="114" text-anchor="middle" font-size="18" fill="#e85d3a" font-family="Georgia, serif">Class 10 Biology · Unit Test</text>
  <text x="64" y="148" font-size="13" fill="#6b6458" font-family="Georgia, serif">Time: 1 hour</text>
  <text x="736" y="148" text-anchor="end" font-size="13" fill="#6b6458" font-family="Georgia, serif">Max. marks: 40 · Page 1 of 2</text>
