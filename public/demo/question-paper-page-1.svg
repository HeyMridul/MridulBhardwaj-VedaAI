        <text x="64" y="170" font-size="18" font-weight="700" fill="#2c2c2c" font-family="Georgia, serif">1.</text>
        <text x="118" y="198" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">Which blood vessel carries blood away from the heart?</text>
        <text x="736" y="170" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">[2]</text>
      

        <text x="64" y="310" font-size="18" font-weight="700" fill="#2c2c2c" font-family="Georgia, serif">2.</text>
        <text x="118" y="338" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">Which of the following organelles is primarily involved in photosynthesis?</text>
        <text x="736" y="310" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">[2]</text>
      

        <text x="64" y="450" font-size="18" font-weight="700" fill="#2c2c2c" font-family="Georgia, serif">3.</text>
        <text x="118" y="478" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">Explain the role of chloroplasts in photosynthesis, naming the main pigments involved</text>
<text x="118" y="500" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">and briefly outlining the two major stages of the process.</text>
        <text x="736" y="450" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">[5]</text>
      

        <text x="64" y="590" font-size="18" font-weight="700" fill="#2c2c2c" font-family="Georgia, serif">4.</text>
        <text x="118" y="618" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">Describe the flow of blood through the human heart starting from the right atrium and</text>
<text x="118" y="640" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">ending at the aorta, include the names of the valves crossed.</text>
        <text x="736" y="590" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">[5]</text>
      

        <text x="64" y="730" font-size="18" font-weight="700" fill="#2c2c2c" font-family="Georgia, serif">5.</text>
        <text x="118" y="758" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">Draw a labelled diagram of an alveolus showing capillaries and air space (label all</text>
<text x="118" y="780" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">exchange).</text>
        <text x="736" y="730" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">[3]</text>
      

        <text x="64" y="870" font-size="18" font-weight="700" fill="#2c2c2c" font-family="Georgia, serif">6.</text>
        <text x="118" y="898" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">Draw a neat labelled diagram of the human digestive system (stomach, small intestine,</text>
<text x="118" y="920" font-size="16" fill="#2c2c2c" font-family="Georgia, serif">large intestine, liver, pancreas) and label the site where most absorption occurs.</text>
        <text x="736" y="870" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">[5]</text>
      
  <text x="400" y="1052" text-anchor="middle" font-size="12" fill="#8a7a66" font-family="Georgia, serif">Turn over</text>
