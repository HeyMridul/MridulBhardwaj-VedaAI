      <text x="92" y="128" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Q12. Minute ventilation = 0.5 L × 12 breaths</text>
<text x="92" y="156" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">= 6 L / minute.</text>
      <text x="92" y="368" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Q15. The mitochondria is the powerhouse of the</text>
<text x="92" y="396" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">cell. It produces ATP by aerobic respiration.</text>
      <text x="92" y="620" font-size="20" fill="#7a6a58" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">(I think I finished everything? Not sure about</text>
