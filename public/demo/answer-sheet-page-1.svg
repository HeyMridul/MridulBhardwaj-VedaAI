  <text x="88" y="58" font-size="13" fill="#8a7a66" font-family="Georgia, serif">A. Sharma  ·  Roll 17  ·  Class 10 Biology</text>
  <text x="752" y="58" text-anchor="end" font-size="13" fill="#8a7a66" font-family="Georgia, serif">Page 1 of 4</text>

  
      <rect x="64" y="88" width="672" height="143" fill="none"/>
      <text x="92" y="118" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Q1. Arteries (aorta) carry blood away from the heart.</text>
<text x="92" y="146" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Thick muscular walls keep the pressure high.</text>
      <text x="92" y="278" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Q3. Chloroplasts are the site of photosynthesis.</text>
<text x="92" y="306" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Main pigments: chlorophyll a and chlorophyll b.</text>
<text x="92" y="334" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Light reactions happen on the thylakoid membrane</text>
<text x="92" y="362" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">and the Calvin cycle happens in the stroma.</text>
<text x="92" y="390" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Light energy → ATP + NADPH → glucose.</text>
      <text x="92" y="598" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Q2. Chloroplast.</text>
      <text x="92" y="778" font-size="22" fill="#1e3f73" font-family="Comic Sans MS, Segoe Script, cursive" font-style="italic">Q5. Alveolus (gas exchange)</text>
